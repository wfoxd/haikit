<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rebook · a HaiKIT demo</title>
    <meta name="description" content="Rebook, built with HaiKIT: the airline cancels your flight, the AI tells you before you ask and finds every way there, and you steer with clicks." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/hai-client/hai.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mountChat } from "/hai-client/app.js";
      import { registry, notices } from "/components.js";
      import { mountOps } from "/ops.js";

      const chat = mountChat({
        root: document.querySelector("#app"),
        registry, // trip_card, rebooking_options, seat_map, care_options, boarding_pass
        notices, // flight_cancelled, seat_confirmed
        title: "Rebook",
        subtitle: "a HaiKIT demo · AI drives, you steer",
        placeholder: "Ask about the options: “which are nonstop?”",
      });

      // The Airline ops bar under the header plays the airline.
      mountOps(document.querySelector("#app"), chat);

      // How many people are rebooking now: everyone here is on the same
      // cancelled flight. A signal goes to every open tab and never to the
      // model; a chip in the header shows the latest count.
      const chip = document.createElement("span");
      chip.className = "crowd-chip";
      chip.hidden = true;
      document.querySelector("#app .hai-actions")?.prepend(chip);
      const show = (/** @type {typeof chat.state} */ state) => {
        const count = /** @type {{ count?: number } | undefined} */ (state.signals.rebooking)?.count ?? 0;
        chip.hidden = count < 1;
        chip.textContent = `${count} rebooking now`;
      };
      chat.subscribe((state, event) => {
        if (event.type === "signal" && event.name === "rebooking") show(state);
      });
      show(chat.state);
    </script>
  </body>
</html>
