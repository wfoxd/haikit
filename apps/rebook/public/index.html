<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rebook · a HaiKIT demo</title>
    <meta name="description" content="Rebook, built with HaiKIT: the airline cancels your flight, the AI tells you before you ask and finds every way there, or books your flight home, and you steer with clicks." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/hai-client/hai.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mountChat } from "/hai-client/app.js";
      import { registry, notices } from "/components.js";
      import { mountOps } from "/ops.js";

      const chat = mountChat({
        root: document.querySelector("#app"),
        // trip_card, rebooking_options, seat_map, care_options, boarding_pass, and for
        // the flight home, flight_search, flight_results, fare_options, booking_review,
        // booking_confirmed
        registry,
        notices, // flight_cancelled, seat_confirmed, ticket_issued
        title: "Rebook",
        subtitle: "a HaiKIT demo · AI drives, you steer",
        placeholder: "Try “book my flight home on Sunday”, or “which are nonstop?”",
      });

      // The Airline ops bar under the header plays the airline.
      mountOps(document.querySelector("#app"), chat);
    </script>
  </body>
</html>
