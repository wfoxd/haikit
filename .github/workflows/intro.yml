name: intro

# apps/intro is a standalone app on the published @haikit/* packages, outside
# the workspaces, so ci.yml never builds or tests it. `test` runs its own
# tests, only when something it's made of changes; `latest` checks daily that
# it still works on the newest HaiKIT.
on:
  push:
    branches: [main]
    paths: ["apps/intro/**", ".github/workflows/intro.yml"]
  pull_request:
    paths: ["apps/intro/**", ".github/workflows/intro.yml"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the engines floor (type stripping on by default), and what the
        # Dockerfile and the deployment guide run
        node: ["22.18", "24"]
    defaults:
      run:
        working-directory: apps/intro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/intro/package-lock.json
      - run: npm ci

      # server and browser typecheck, which also compiles test/guarantees.ts:
      # what HaiKIT refuses to compile, against this app's own surfaces.
      # then the smoke test: the real server, every lesson's live excerpts,
      # the tutorial parsed, the guide driven through the menu and lessons
      - run: npm test

  # The lockfile pins what `test` sees, so a HaiKIT release can't break it.
  # This runs the app's own update scripts instead, as a maintainer would, and
  # tests the result: red here means the next `npm run haikit:update` or
  # `npm run tutorial:update` would fail, and why. Nothing is committed.
  latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # haikit: every @haikit/* package at @latest from npm
        # tutorial: docs/tutorial.md from main, through the app's parser
        update: [haikit, tutorial]
    defaults:
      run:
        working-directory: apps/intro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/intro/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.update }}:update
      - name: Versions tested
        if: always() && matrix.update == 'haikit'
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm ls @haikit/core @haikit/server @haikit/client @haikit/anthropic @haikit/postgres --depth=0 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
