name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # A real server, so the Postgres store's concurrency checks run on every PR.
    # Those are the only checks that can catch a store whose lease acquisition
    # is a read followed by a write — one process can never interleave that.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: haikit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # the framework compiles
      - run: npm run build

      # every consumer still compiles — server code AND browser components,
      # which are checked against the same shared contract
      - run: npm run typecheck

      # the four type-level guarantees are still enforced.
      # this is the check most repos don't have and this one needs.
      - run: npm run typetest

      # every StoreAdapter rule an in-process store could ignore and a
      # networked one cannot: handle scoping, batch reads, turn leasing
      - run: npm run storetest

      # the same contract against @haikit/postgres: PGlite in-process, then a
      # real server with twenty connections racing for one lease
      - run: npm run pgtest
        env:
          HAIKIT_PG_URL: postgres://postgres:haikit@localhost:5432/postgres

      # the elicit loop actually works: surface renders, turn parks,
      # interaction resolves it, binding table rejects what it should
      - run: npm run smoke

      # what npm would actually serve still works. every check above runs
      # against workspace symlinks, which hide `files` omissions, bad `exports`
      # paths and undeclared type dependencies completely.
      - run: npm run packtest
